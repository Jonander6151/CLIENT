<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Guess The Number</title>
  <link href="guessNumber.css" rel="stylesheet" type="text/css"/>
</head>
<body>
  <!-- DECORATIVE SHAPES -->
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
  <!-- START SCREEN -->
  <section class="screen start-screen">
    <div class="content">
      <h1>Can you find the secret number?</h1>
      <p>
        You only have 5 chances.
        Every wrong guess brings you closer to defeat...
      </p>
      <button class="start-btn">START GAME</button>
    </div>
  </section>
  <!-- GAME SCREEN -->
  <section class="screen game-screen">
    <div class="game-box">
      <h2>Guess The Number</h2>
      <h2>(1-100)</h2>
      <div class="input-zone">
        <input type="number" placeholder="?" />
        <button class="guess-btn"> GUESS </button>
      </div>

      <!-- ATTEMPTS -->
      <div class="lives">
       <div class="life"></div>
        <div class="life"></div>
        <div class="life"></div>
        <div class="life"></div>
        <div class="life"></div>
      </div>
      <!-- MESSAGE -->
      <div class="message-box">
        <div class="message">
          Wrong number...
        </div>
      </div>
    </div>
  </section>
  <script src="guessNumber.js" type="text/javascript"></script>
</body>
</html>
